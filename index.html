<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب</title>
    <link rel="stylesheet" href="style.css">
    <!-- font  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
</head>
<body dir="rtl">
    <header>
        <h1>نظام إدارة وتحليل نتائج الطلاب</h1>
        <h3>النظام يستخدم local storage للتخزين المحلي اختبر بنفسك </h3>
    </header>
    <div class="container">
    <div class="student">
            <label for="student-id">id :</label>
            <input type="number" id="student-id" required>
            <label for="student-name">اسم الطالب:</label>
            <input type="text" id="student-name" required>
            <label for="student-grades">الدرجات:</label>
            <div id="student-grades">
                <input id="grade1" class="grade" type="number" placeholder="الدرجة 1" required>
                <input id="grade2" class="grade" type="number" placeholder="الدرجة 2" required>
                <input id="grade3" class="grade" type="number" placeholder="الدرجة 3" required>
            </div>
            <label for="student-attendance">نسبة الحضور (%):</label>
            <input type="number" id="student-attendance" required>
            <button id="analyze-btn">تحليل بيانات الطالب</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>id</th>
                    <th>اسم الطالب</th>
                    <th>المتوسط</th>
                    <th>التقدير</th>
                    <th>النتيجه</th>
                    <th>تعديل</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="results-body">
            </tbody>
        </table>
        <div class="strugglingStudents" id="struggling-students">
            <h2> الطلاب المتعثرين بعد درجات الرافه :</h2>
            <ul id="struggling-students-body">
            </ul>
        </div>
</div>
    <script src="main.js"></script>
</body>
</html>
